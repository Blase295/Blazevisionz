name: Verify Blazevisionz
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --config wrangler.worker.jsonc --dry-run
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '6e87eeb946761a41b98f852ec548e81a'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo '::notice::Automatic deployment is blocked until the repository CLOUDFLARE_API_TOKEN secret is configured.'
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply blazevisionz-production --config wrangler.worker.jsonc --env production --remote
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --config wrangler.worker.jsonc --env production
